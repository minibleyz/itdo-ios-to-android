name: Convert SwiftUI to Android via Skip

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Install Skip
        run: brew install skiptools/skip/skip

      - name: Verify Skip
        run: skip --version

      - name: Generate Xcode project with XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Android with Skip
        run: |
          skip build --platform android --skip-ios --skip-web
          ls -la android/ 2>/dev/null || ls -la ITDOAndroid/ 2>/dev/null || echo "Checking output dirs..."
          find . -name "*.apk" -o -name "*.aab" -o -name "build.gradle*" 2>/dev/null | head -20

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: ITDOAndroid-project
          path: |
            android/
            ITDOAndroid/
            ITDOAndroidConverted/
            *.apk
            *.aab
          retention-days: 30
