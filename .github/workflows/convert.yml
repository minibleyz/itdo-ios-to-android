name: Convert SwiftUI to Android via Skip

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Skip toolchain
        uses: skiptools/actions/setup-skip@v1
        with:
          swift-version: '6.0'
          install-swift-android-sdk: 'true'
          verbose: 'true'

      - name: Clean Skip cache
        run: |
          rm -rf .build/plugins/outputs/ || true
          rm -rf skip-export/ || true

      # Шаг 1: удаляем private у View, но НЕ трогаем файлы с дубликатами
      - name: Remove private from View declarations
        run: |
          echo "🔍 Убираем private у View (кроме файлов с дубликатами)..."

          # Файлы, где есть дубликаты AvatarView/AsyncImageView — не трогаем
          EXCLUDE_FILES=(
            "ITDOApp/Views/Feed/CommentsView.swift"
            "ITDOApp/Views/Feed/FeedView.swift"
            "ITDOApp/Views/Feed/PostDetailView.swift"
            "ITDOApp/Views/Profile/HiddenAuthorsView.swift"
            "ITDOApp/Utilities/WidgetDataWriter.swift"
          )

          CHANGED=0
          for file in $(find ITDOApp -name "*.swift" -type f); do
            SKIP=false
            for excl in "${EXCLUDE_FILES[@]}"; do
              if [[ "$file" == *"$excl"* ]]; then
                SKIP=true
                break
              fi
            done

            if [ "$SKIP" = true ]; then
              echo "⏭️  Пропускаем: $file"
              continue
            fi

            if grep -qE 'private (struct [A-Za-z0-9_]*View|var [a-zA-Z0-9_]+: some View)' "$file"; then
              echo "✏️  Исправляем: $file"
              perl -i -pe 's/\bprivate\s+(struct\s+\w*View)/$1/g' "$file"
              perl -i -pe 's/\bprivate\s+(var\s+\w+:\s*some\s+View)/$1/g' "$file"
              CHANGED=$((CHANGED + 1))
            fi
          done

          echo "✅ Исправлено файлов: $CHANGED"

      # Шаг 2: удаляем дубликаты AvatarView/AsyncImageView
      - name: Remove duplicate AvatarView and AsyncImageView
        run: |
          echo "🔧 Удаляем дубликаты AvatarView/AsyncImageView..."

          # Оставляем AvatarView только в FeedView.swift, остальные удаляем
          # (или наоборот — на ваш выбор)
          # Здесь нужно вручную указать, какой файл оставить

          # Например, удаляем AvatarView из CommentsView, PostDetailView, HiddenAuthorsView
          # Оставляем только в FeedView.swift

          # Это делается вручную, потому что структура кода у вас своя.
          # Пришлите код AvatarView из этих файлов — и я напишу точный скрипт.
          echo "⚠️  Требуется ручное вмешательство: уберите дубликаты AvatarView/AsyncImageView"
          echo "   Оставьте одну копию в общем файле, остальные удалите"

      # Шаг 3: запускаем экспорт
      - name: Export Android project
        run: skip export

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: ITDOAndroid-project
          path: skip-export/
          retention-days: 30
