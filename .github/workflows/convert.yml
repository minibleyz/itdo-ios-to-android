name: Convert SwiftUI to Android via Skip

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Skip toolchain
        uses: skiptools/actions/setup-skip@v1
        with:
          swift-version: '6.0'
          install-swift-android-sdk: 'true'
          verbose: 'true'

      - name: Clean Skip cache
        run: |
          rm -rf .build/plugins/outputs/ || true
          rm -rf skip-export/ || true

      # Шаг 1: исправляем исходники в корне
      - name: Fix private views in source
        run: |
          echo "🔍 Ищем private View в исходниках..."
          CHANGED=0
          for file in $(find . -name "*.swift" -type f -not -path "./.build/*" -not -path "./ShareExtension/*" -not -path "./ITDOAppWidget/*"); do
            if grep -qE 'private (struct [A-Za-z0-9_]*View|var [a-zA-Z0-9_]+: some View)' "$file"; then
              perl -i -pe 's/\bprivate\s+(struct\s+\w*View)/$1/g' "$file"
              perl -i -pe 's/\bprivate\s+(var\s+\w+:\s*some\s+View)/$1/g' "$file"
              CHANGED=$((CHANGED + 1))
            fi
          done
          echo "✅ Исправлено файлов в исходниках: $CHANGED"

      # Шаг 2: запускаем skip export (он скопирует исправленные исходники)
      - name: Export Android project (first attempt)
        continue-on-error: true
        run: skip export

      # Шаг 3: если упало — исправляем копии в .build и пробуем снова
      - name: Fix private views in generated sources
        if: failure()
        run: |
          echo "🔧 Исправляем private View в сгенерированных копиях..."
          CHANGED=0
          for file in $(find .build/plugins/outputs -name "*.swift" -type f 2>/dev/null); do
            if grep -qE 'private (struct [A-Za-z0-9_]*View|var [a-zA-Z0-9_]+: some View)' "$file"; then
              echo "✏️  Исправляем: $file"
              perl -i -pe 's/\bprivate\s+(struct\s+\w*View)/$1/g' "$file"
              perl -i -pe 's/\bprivate\s+(var\s+\w+:\s*some\s+View)/$1/g' "$file"
              CHANGED=$((CHANGED + 1))
            fi
          done
          echo "✅ Исправлено файлов в .build: $CHANGED"

      # Шаг 4: повторяем экспорт
      - name: Export Android project (retry)
        if: failure()
        run: skip export

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: ITDOAndroid-project
          path: skip-export/
          retention-days: 30
