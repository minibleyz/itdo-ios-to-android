name: Convert SwiftUI to Jetpack Compose

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Skip CLI
        run: npm install -g @skip-cli/cli

      - name: Convert SwiftUI to Jetpack Compose
        run: |
          cd ITDOApp
          skip convert --output ../ITDOAndroidConverted
        working-directory: .

      - name: Upload converted code
        uses: actions/upload-artifact@v4
        with:
          name: ITDOAndroid-converted
          path: ITDOAndroidConverted/
          retention-days: 30
