name: Convert SwiftUI to Android via Skip

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Skip toolchain
        uses: skiptools/actions/setup-skip@v1
        with:
          swift-version: '6.0'
          install-swift-android-sdk: 'true'
          verbose: 'true'

      # Шаг 1: убираем private во всех Swift-файлах
      - name: Remove all 'private' from Swift files
        run: |
          echo "🔍 Убираем все 'private' из Swift-файлов..."
          CHANGED=0

          for file in $(find . -name "*.swift" -type f \
            -not -path "./.build/*" \
            -not -path "./skip-export/*"); do

            if grep -q '\bprivate\b' "$file"; then
              echo "✏️  Обрабатываем: $file"
              # Убираем слово private везде, где оно встречается как отдельное слово
              # (не трогаем часть других слов вроде "privateKey")
              perl -i -pe 's/\bprivate\s+//g' "$file"
              CHANGED=$((CHANGED + 1))
            fi
          done

          echo "✅ Обработано файлов: $CHANGED"

          # Проверка: остались ли private
          echo ""
          echo "🔎 Проверка: остались ли 'private' в Swift-файлах?"
          REMAINING=$(grep -rEn '\bprivate\b' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="skip-export" . || true)
          if [ -n "$REMAINING" ]; then
            echo "⚠️  Всё ещё найдены 'private':"
            echo "$REMAINING"
          else
            echo "👍 Приватных объявлений не осталось"
          fi

      # Шаг 2: показываем diff (для отладки)
      - name: Show changes
        run: |
          echo "📋 Изменённые файлы:"
          git diff --stat

      # Шаг 3: экспорт
      - name: Export Android project
        run: skip export

      # Шаг 4: загружаем результат
      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: ITDOAndroid-project
          path: skip-export/
          retention-days: 30
