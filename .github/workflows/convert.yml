name: Convert SwiftUI to Android via Skip

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Skip toolchain
        uses: skiptools/actions/setup-skip@v1
        with:
          swift-version: '6.0'
          install-swift-android-sdk: 'true'
          verbose: 'true'

      # Шаг 0: очищаем кеш Skip, чтобы он не использовал старые копии исходников
      - name: Clean Skip cache
        run: |
          echo "🧹 Очищаем кеш Skip..."
          rm -rf .build/plugins/outputs/ || true
          rm -rf skip-export/ || true
          echo "✅ Кеш очищен"

      # Шаг 1: исправляем private View на internal
      - name: Fix private views for Skip
        run: |
          echo "🔍 Ищем private View для замены..."
          CHANGED=0

          # Исключаем ShareExtension и ITDOAppWidget — они не участвуют в Skip-экспорте
          for file in $(find . -name "*.swift" -type f \
            -not -path "./ShareExtension/*" \
            -not -path "./ITDOAppWidget/*" \
            -not -path "./.build/*"); do

            if grep -qE 'private (struct [A-Za-z0-9_]*View|var [a-zA-Z0-9_]+: some View)' "$file"; then
              echo "✏️  Исправляем: $file"
              # Убираем private у struct ...View
              perl -i -pe 's/\bprivate\s+(struct\s+\w*View)/$1/g' "$file"
              # Убираем private у var ...: some View
              perl -i -pe 's/\bprivate\s+(var\s+\w+:\s*some\s+View)/$1/g' "$file"
              CHANGED=$((CHANGED + 1))
            fi
          done

          echo "✅ Исправлено файлов: $CHANGED"

          # Показываем, какие private View остались (если есть)
          echo ""
          echo "🔎 Проверка: остались ли private View?"
          REMAINING=$(grep -rEn 'private (struct [A-Za-z0-9_]*View|var [a-zA-Z0-9_]+: some View)' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="ShareExtension" \
            --exclude-dir="ITDOAppWidget" . || true)
          if [ -n "$REMAINING" ]; then
            echo "⚠️  Всё ещё найдены private View:"
            echo "$REMAINING"
          else
            echo "👍 Приватных View не осталось"
          fi

      # Шаг 2: показываем diff, чтобы видеть, что изменилось
      - name: Show changes made by fix
        run: |
          echo "📋 Изменения, внесённые скриптом:"
          git diff --stat
          echo ""
          echo "📋 Подробный diff:"
          git diff

      # Шаг 3: запускаем экспорт
      - name: Export Android project
        run: skip export

      # Шаг 4: загружаем результат
      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: ITDOAndroid-project
          path: skip-export/
          retention-days: 30
